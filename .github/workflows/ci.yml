name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The build never queries Sanity: the only CMS-driven page renders per request,
# not at build time. These placeholders exist because astro.config.mjs and the
# Studio route want a project id present, not because anything reads this
# dataset. The real values live in the Cloudflare build environment.
env:
  PUBLIC_SANITY_PROJECT_ID: ci-placeholder
  PUBLIC_SANITY_DATASET: production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Type-check Astro components
        run: npm run check

      - name: Build
        run: npm run build

      # The prerendered-page assertions read dist/, so they follow the build.
      - name: Test
        run: npm test
